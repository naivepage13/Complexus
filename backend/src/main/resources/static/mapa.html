<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapa - Complexus</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<!--
  Mapa hierarquico: Estados -> Cidades -> Estradas, com zoom semantico.
  O Leaflet vem da pasta vendor/, nao de CDN: o jogo roda offline.
-->
<header class="cabecalho">
    <div class="cabecalho-conteudo">
        <span class="marca">Complexus</span>
        <nav class="menu">
            <a href="index.html">Painel</a>
            <a href="empresas.html">Empresas</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="politica.html">Politica</a>
            <a href="mapa.html">Mapa</a>
            <a href="estatisticas.html">Estatisticas</a>
            <a href="atualizacoes.html">Atualizacoes</a>
        </nav>
        <div class="identificacao" id="relogio-turno"></div>
        <div class="identificacao" id="identificacao"></div>
    </div>
</header>

<main class="mapa-pagina">
    <div id="mapa-layout">
        <div id="mapa-mapa"></div>

        <aside id="painel-decisao" class="oculto">
            <button class="botao botao-neutro botao-pequeno btn-fechar-painel" onclick="fecharPainel()">Fechar</button>
            <div id="painel-conteudo"></div>
        </aside>
    </div>

    <div id="mapa-legenda">
        <span class="legenda-item"><span class="legenda-cor cor-estado"></span>Estado</span>
        <span class="legenda-item"><span class="legenda-cor cor-cidade"></span>Cidade</span>
        <span class="legenda-item"><span class="legenda-cor cor-estrada"></span>Estrada</span>
        <span id="indicador-zoom" class="legenda-item suave"></span>
    </div>
</main>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/app.js"></script>
<script src="js/mapa.js"></script>
</body>
</html>
