<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel - Complexus</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<!--
  Painel inicial enxuto: serve de ponto de partida, nao de relatorio.
  Numeros de desempenho ficam na pagina de cada empresa e em estatisticas.
-->
<header class="cabecalho">
    <div class="cabecalho-conteudo">
        <span class="marca">Complexus</span>
        <nav class="menu">
            <a href="index.html">Painel</a>
            <a href="empresas.html">Empresas</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="politica.html">Politica</a>
            <a href="estatisticas.html">Estatisticas</a>
            <a href="atualizacoes.html">Atualizacoes</a>
        </nav>
        <div class="identificacao" id="relogio-turno"></div>
        <div class="identificacao" id="identificacao"></div>
    </div>
</header>

<main class="pagina">
    <div class="titulo-pagina">
        <div>
            <h1 id="saudacao">Painel do jogador</h1>
            <p id="resumo-turno">Carregando a partida...</p>
        </div>
        <div class="acoes">
            <button class="botao botao-secundario" id="avancar-turno">Avancar turno agora</button>
        </div>
    </div>

    <div id="mensagem" class="oculto"></div>

    <section class="atalhos">
        <a class="atalho" href="empresas.html">
            <strong>Empresas</strong>
            <span id="atalho-empresas">-</span>
        </a>
        <a class="atalho" href="investimentos.html">
            <strong>Investimentos</strong>
            <span id="atalho-carteira">-</span>
        </a>
        <a class="atalho" href="politica.html">
            <strong>Politica</strong>
            <span id="atalho-mandatos">-</span>
        </a>
        <a class="atalho" href="estatisticas.html">
            <strong>Estatisticas</strong>
            <span id="atalho-estatisticas">indicadores do mundo</span>
        </a>
    </section>

    <section class="cartao espacado">
        <div class="cartao-cabecalho">
            <h2>Canal de atualizacoes</h2>
            <a href="atualizacoes.html" class="pequeno">ver tudo</a>
        </div>
        <ul class="linha-tempo" id="feed">
            <li class="suave">Carregando...</li>
        </ul>
    </section>
</main>

<footer class="rodape">
    Complexus - 1 turno = 1 hora real = 1 mes de jogo.
</footer>

<script src="js/app.js"></script>
<script src="js/painel.js"></script>
</body>
</html>
