server:
  port: 8080

spring:
  application:
    name: complexus
  datasource:
    url: jdbc:h2:file:./data/complexus;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  web:
    resources:
      # Sem Cache-Control/ETag, o navegador aplica cache heuristico (RFC 7234)
      # sobre o Last-Modified e pode servir HTML/CSS/JS desatualizado mesmo
      # apos um F5 comum. no-cache forca revalidacao condicional a cada carga.
      cache:
        cachecontrol:
          no-cache: true
  h2:
    console:
      enabled: true
      path: /h2-console

jogo:
  # Um turno = 1 hora de tempo real = 1 mes de tempo de jogo.
  turno:
    duracao-minutos: 60
    processamento-automatico: true
  analitico:
    habilitado: true
    url: http://localhost:8100
    timeout-ms: 1500
  admin:
    # Credencial das rotas /api/admin (auditoria e livro-razao).
    # Em producao, sobrescrever pela variavel de ambiente JOGO_ADMIN_TOKEN.
    token: ${JOGO_ADMIN_TOKEN:admin-local}

logging:
  level:
    com.complexus: INFO
