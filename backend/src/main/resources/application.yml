server:
  port: 8080

spring:
  application:
    name: geohistoricalsim
  datasource:
    url: jdbc:h2:file:./data/geohistoricalsim;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

jogo:
  # Um turno = 1 hora de tempo real = 1 mes de tempo de jogo.
  turno:
    duracao-minutos: 60
    processamento-automatico: true
  analitico:
    habilitado: true
    url: http://localhost:8100
    timeout-ms: 1500

logging:
  level:
    com.geohistoricalsim: INFO
