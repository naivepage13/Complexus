[[requisito]]
id = "RF-01"
titulo = "Cadastro e identificação de jogadores"
status = "IMPLEMENTADO"
prioridade = "ALTA"
versao = "0.2.0"
descricao = "Criar conta, entrar na partida e manter um caixa pessoal que financia empresas e investimentos."
criterio = "Um usuário novo se registra, recebe caixa inicial e consegue autenticar em seguida."
implementacao = [
  "backend/src/main/java/com/complexus/jogador/ServicoJogador.java",
  "backend/src/main/java/com/complexus/jogador/JogadorController.java",
  "backend/src/main/resources/static/login.html",
]
testes = ["CredencialEstavelTest#registroEAutenticacao"]
