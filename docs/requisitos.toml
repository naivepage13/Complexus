titulo = "Mapa hierárquico com zoom semântico"
status = "IMPLEMENTADO"
prioridade = "MEDIA"
versao = "0.5.0"
descricao = "Navegar Estados, Cidades e Estradas em três níveis de zoom, com carregamento por viewport, painel de decisão e herança de alíquota e infraestrutura do estado para as cidades filhas."
criterio = "Aproximar revela cidades e estradas; clicar numa cidade abre o painel com PIB e infraestrutura já ajustados pelo estado pai."
implementacao = [
  "backend/src/main/resources/static/mapa.html",
  "backend/src/main/resources/static/js/mapa.js",
  "backend/src/main/resources/static/dados/mapa/estados.geojson",
]
testes = []
observacao = """Veio da main. Integrado ao frontend do jogo na 0.5.0, com Leaflet servido localmente. \nSem teste automatizado: a herança de estado roda só no cliente. \nRenderização verificada (camadas, paleta, dados servidos pelo backend); o zoom e o drill-down NÃO puderam ser \nverificados aqui, porque a animação de zoom do Leaflet não completa no navegador embutido usado nos testes — \nreproduzido com uma instância limpa do Leaflet, e com `zoomAnimation: false` o zoom volta a funcionar. \nConferir num navegador comum; se também travar, a correção é criar o mapa com `zoomAnimation: false`."""

