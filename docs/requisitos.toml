# Catálogo de requisitos do Complexus — FONTE ÚNICA DA VERDADE.
#
# Este arquivo é escrito à mão. Os relatórios (docs/REQUISITOS.md, os blocos
# automáticos do README e do RELATORIO, e a tabela do ROADMAP) são GERADOS a
# partir daqui por `python ferramentas/gerar_documentacao.py`. Não edite os
# arquivos gerados: edite este catálogo.
#
# Campos de cada requisito:
#   id             RF-nn (funcional) ou RNF-nn (não funcional)
#   titulo         frase curta, no infinitivo ou substantiva
#   status         IMPLEMENTADO | PARCIAL | PLANEJADO
#   prioridade     ALTA | MEDIA | BAIXA
#   versao         versão em que entrou (vazio quando ainda não entregue)
#   descricao      o que o sistema faz (ou fará)
#   criterio       critério de aceite verificável
#   implementacao  caminhos reais — o gerador falha se um deles não existir
#   testes         testes que cobrem o requisito (vazio = lacuna de cobertura)
#   observacao     opcional: decisão, limitação ou nota de contexto

[meta]
projeto = "Complexus"
responsavel = "naivepage13"

